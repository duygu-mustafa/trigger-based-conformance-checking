version: 1

model:
  name: readiness_assessment
  description: >
    Readiness assessment is NOT a discrete activity in MIMIC-IV. It is a set of
    physiological criteria (Akella Table 2) that must be satisfied in the 24 h
    observation window immediately preceding SBTStarted.

    Each criterion is encoded as an MP-Declare PRECEDENCE rule (RC-DP-01 ...
    RC-DP-07). The criterion activity (e.g. OxygenationMeasured) is emitted for
    every measurement of the underlying item, regardless of its value. The
    threshold is enforced by the correlation condition, evaluated on the most
    recent measurement before SBTStarted (target_selection: last).
    Per Burattin et al. (2016) Table 2, precedence MFOTL semantics:
      G(∀x.((B ∧ ϕ_a(x)) → O_I(A ∧ ∃y.ϕ_c(x,y))))
    where B = SBTStarted (activation), A = CriterionMeasured (must precede).
    Violation: no criterion measurement in the prior 24 h, or the most recent
    one does not meet the threshold.

  # ── Computed Context Variables ────────────────────────────────────────────
  # Documentation only: these names are available inside data conditions and
  # are computed per evaluation point by conformance/checker.py
  # (_build_eval_context) from the evaluation trace. Not read by the loader.

  context_variables:

    ventilation_duration_hours:
      description: >
        Hours elapsed from the first InvasiveVentilationStarted in the trace to
        the evaluation timestamp (or the derived ventilation duration, if longer).
      derived: true

    hours_since_intubation:
      description: >
        Hours elapsed from the first InvasiveVentilationStarted in the trace to
        the evaluation timestamp.
      derived: true

    previous_SBT_failed:
      description: >
        Boolean flag. True if an SBTFailed or SBTStopped occurs in the trace
        before the evaluation timestamp.
      derived: true

    is_chronic:
      description: >
        Boolean flag. True if an earlier SBTDeferred event carries the reason
        "chronic vent dependent".
      derived: true

  # ── Readiness Data Conditions ─────────────────────────────────────────────
  # Named conditions referenced by the correlation_condition of the RC-DP rules.
  # Each is written in the POSITIVE form (criterion met) and evaluated on the
  # latest value of each referenced item before the SBTStarted timestamp.

  data_conditions:

    oxygenation_ok:
      title: "Oxygenation criterion met"
      description: "PaO2/FiO2 >= 150 OR (SpO2 >= 90% on FiO2 <= 40% and PEEP <= 5 cmH2O)"
      logic: OR
      expressions:
        - "items['pao2fio2ratio'] >= 150"
        - "(items[220277] >= 90) AND (items['fio2_bg'] <= 40) AND (items['peep_vent'] <= 5)"

    ph_ok:
      title: "pH criterion met"
      description: "Arterial pH > 7.25"
      expression: "items['ph_bg'] > 7.25"

    hemoglobin_ok:
      title: "Hemoglobin criterion met"
      description: "Hemoglobin >= 7 g/dL"
      expression: "items['hemoglobin_bg'] >= 7.0"

    temperature_ok:
      title: "Temperature criterion met"
      description: "Core temperature <= 38 degrees C"
      expression: "items[223762] <= 38.0"

    vasopressor_ok:
      title: "Vasopressor criterion met"
      description: >
        Norepinephrine-equivalent <= 0.1 mcg/kg/min (hemodynamically stable).
        Source: mimiciv_derived.norepinephrine_equivalent_dose
      expression: "items['norepinephrine_equiv'] <= 0.1"

    mental_status_ok:
      title: "Mental status criterion met"
      description: >
        Patient is awake and easily arousable. Satisfied if CAM-ICU RASS LOC
        (228302) = 'No', or via the SAS fallback instrument (223753) in
        [3, 4] (Sedated/Calm-Cooperative). RASS LOC is documented in only a
        small fraction of stays; SAS is the far more common instrument in
        this cohort, so the fallback is required for adequate coverage.
      logic: OR
      expressions:
        - "items[228302] == 'No'"
        - "items[223753] in [3, 4]"

    inspiratory_effort_ok:
      title: "Inspiratory effort criterion met"
      description: >
        Tidal Volume (spontaneous) (itemid 224686) > 0 mL -- patient is
        initiating at least some spontaneous inspiratory effort.
        Proxy for Table 2 criterion 5: "initiate inspiratory effort".
      expression: "items[224686] > 0"

  # ── Constraints ───────────────────────────────────────────────────────────

  constraints:

    # ════════════════════════════════════════════════════════════════════════
    # RC-DP-01 — Oxygenation
    # ════════════════════════════════════════════════════════════════════════

    - id: RC-DP-01
      label: "Oxygenation criterion must be met at SBT start"
      template: PRECEDENCE
      context_window_pre_hours: 24
      activation: SBTStarted
      target: OxygenationMeasured
      target_selection: last
      correlation_condition: oxygenation_ok
      correlation_condition_display: "PaO2/FiO2 >= 150 OR (SpO2 >= 90% on FiO2 <= 40% and PEEP <= 5 cmH2O)"
      time_condition:
        min_hours: -24
        max_hours: 0
      rationale: >
        SBTStarted must be preceded within 24h by an OxygenationMeasured event.
        Only the most recent OxygenationMeasured before SBTStarted is evaluated
        (target_selection: last). OxygenationMeasured is emitted for every
        PaO2/FiO2 or SpO2 measurement, unconditionally; threshold enforced solely
        by the oxygenation_ok correlation_condition: PaO2/FiO2 >= 150 OR
        (SpO2 >= 90% on FiO2 <= 40% and PEEP <= 5 cmH2O). FiO2/PEEP/SpO2 are
        evaluated independently (latest value per item), not required concurrent.
        Akella Table 2, criterion 2.

    # ════════════════════════════════════════════════════════════════════════
    # RC-DP-02 — pH
    # ════════════════════════════════════════════════════════════════════════

    - id: RC-DP-02
      label: "pH criterion must be met at SBT start"
      template: PRECEDENCE
      context_window_pre_hours: 24
      activation: SBTStarted
      target: pHMeasured
      target_selection: last
      correlation_condition: ph_ok
      correlation_condition_display: "pH > 7.25"
      time_condition:
        min_hours: -24
        max_hours: 0
      rationale: >
        SBTStarted must be preceded within 24h by a pHMeasured event whose
        most recent ph_bg value exceeds 7.25. pHMeasured is emitted for every
        ph_bg measurement; the threshold is enforced via correlation_condition
        evaluated on the most recent preceding event (target_selection: last).
        Akella Table 2, criterion 3.

    # ════════════════════════════════════════════════════════════════════════
    # RC-DP-03 — Hemoglobin
    # ════════════════════════════════════════════════════════════════════════

    - id: RC-DP-03
      label: "Hemoglobin criterion must be met at SBT start"
      template: PRECEDENCE
      context_window_pre_hours: 24
      activation: SBTStarted
      target: HemoglobinMeasured
      target_selection: last
      correlation_condition: hemoglobin_ok
      correlation_condition_display: "Hgb ≥ 7 g/dL"
      time_condition:
        min_hours: -24
        max_hours: 0
      rationale: >
        SBTStarted must be preceded within 24h by a HemoglobinMeasured event
        whose most recent hemoglobin_bg value is >= 7 g/dL. HemoglobinMeasured
        is emitted for every hemoglobin_bg measurement; the threshold is enforced
        via correlation_condition on the most recent preceding event
        (target_selection: last). Akella Table 2, criterion 6.

    # ════════════════════════════════════════════════════════════════════════
    # RC-DP-04 — Temperature
    # ════════════════════════════════════════════════════════════════════════

    - id: RC-DP-04
      label: "Temperature criterion must be met at SBT start"
      template: PRECEDENCE
      context_window_pre_hours: 24
      activation: SBTStarted
      target: TemperatureMeasured
      target_selection: last
      correlation_condition: temperature_ok
      correlation_condition_display: "Temp ≤ 38 °C"
      time_condition:
        min_hours: -24
        max_hours: 0
      rationale: >
        SBTStarted must be preceded within 24h by a TemperatureMeasured event
        whose most recent temperature (itemid 223762) is <= 38 degrees C.
        TemperatureMeasured is emitted for every temperature measurement; the
        threshold is enforced via correlation_condition on the most recent
        preceding event (target_selection: last). Akella Table 2, criterion 7.

    # ════════════════════════════════════════════════════════════════════════
    # RC-DP-05 — Vasopressor
    # ════════════════════════════════════════════════════════════════════════

    - id: RC-DP-05
      label: "Vasopressor criterion must be met at SBT start"
      template: PRECEDENCE
      context_window_pre_hours: 24
      activation: SBTStarted
      target: VasopressorMeasured
      target_selection: last
      correlation_condition: vasopressor_ok
      correlation_condition_display: "NE-equiv ≤ 0.1"
      time_condition:
        min_hours: -24
        max_hours: 0
      rationale: >
        SBTStarted must be preceded within 24h by a VasopressorMeasured event
        whose most recent NE-equivalent dose is <= 0.1 mcg/kg/min. VasopressorMeasured
        is emitted for every norepinephrine_equiv measurement; the threshold is
        enforced via correlation_condition on the most recent preceding event
        (target_selection: last). Akella Table 2, criterion 4.

    # ════════════════════════════════════════════════════════════════════════
    # RC-DP-06 — Mental Status
    # ════════════════════════════════════════════════════════════════════════

    - id: RC-DP-06
      label: "Mental status criterion must be met at SBT start"
      template: PRECEDENCE
      context_window_pre_hours: 24
      activation: SBTStarted
      target: MentalStatusMeasured
      correlation_condition: mental_status_ok
      correlation_condition_display: "RASS LOC 'No' OR SAS in [3, 4]"
      target_selection: last
      time_condition:
        min_hours: -24
        max_hours: 0
      rationale: >
        SBTStarted must be preceded within 24h by a MentalStatusMeasured event
        whose most recent reading satisfies RASS LOC (228302) = 'No' or, via
        the SAS fallback (223753), is in [3, 4]. MentalStatusMeasured is
        emitted for every RASS LOC and SAS measurement; the threshold is
        enforced via correlation_condition on the most recent preceding
        event (target_selection: last). Akella Table 2, criterion 8.

    # ════════════════════════════════════════════════════════════════════════
    # RC-DP-07 — Inspiratory Effort
    # ════════════════════════════════════════════════════════════════════════

    - id: RC-DP-07
      label: "Inspiratory effort criterion must be met at SBT start"
      template: PRECEDENCE
      context_window_pre_hours: 24
      activation: SBTStarted
      target: InspiratoryEffortMeasured
      target_selection: last
      correlation_condition: inspiratory_effort_ok
      correlation_condition_display: "Spont. Tidal Vol > 0 mL"
      time_condition:
        min_hours: -24
        max_hours: 0
      rationale: >
        SBTStarted must be preceded within 24h by an InspiratoryEffortMeasured
        event whose most recent spontaneous tidal volume (itemid 224686) is > 0 mL.
        InspiratoryEffortMeasured is emitted for every SpTV measurement; the
        threshold is enforced via correlation_condition on the most recent
        preceding event (target_selection: last). Akella Table 2, criterion 5.
