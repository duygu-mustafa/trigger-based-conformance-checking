version: 1

model:
  name: readiness_assessment
  description: >
    Readiness assessment is NOT a discrete activity in MIMIC-IV. It is a set of
    physiological conditions that must ALL be satisfied in the observation window
    immediately preceding SBTStarted. Constraints here are encoded as MP-Declare
    guards on SBTStarted: the activation event is SBTStarted itself, and each
    data condition is an activation condition that, if violated, constitutes a protocol deviation.

    Ventilation onset is sourced from derived weaning state transitions.
    The 48-72 h eligibility window is computed relative to Intubation.starttime
    (procedureevents itemid 224385).

  # ── Computed Context Variables ────────────────────────────────────────────
  # These are derived at query time from procedureevents, not from chartevents.

  context_variables:

    ventilation_duration_hours:
      description: >
        Hours elapsed from InvasiveVentilationStarted to the current event
        timestamp.
      source: ventilator_derived
      itemid: derived_invasive_ventilation_start

    hours_since_intubation:
      description: >
        Hours elapsed from Intubation.starttime (procedureevents itemid 224385)
        to the current event timestamp. Used to enforce the 48-72 h readiness
        eligibility window.
      source: procedureevents
      itemid: 224385

    previous_SBT_failed:
      description: >
        Boolean flag. True if the most recent SBTCompleted in this stay
        had value = "Failure".
      derived: true

    is_chronic:
      description: >
        Boolean flag. True if the patient is marked as chronic ventilation dependent.
      derived: true

  # ── Readiness Data Conditions ─────────────────────────────────────────────
  # All conditions are evaluated in the chartevents observation window
  # immediately before (within 24 h of) the SBTStarted timestamp.

  data_conditions:

    oxygenation_ok:
      title: "Oxygenation criterion met"
      description: "PaO2/FiO2 >= 150 OR (SpO2 >= 90% on FiO2 <= 40% and PEEP <= 5 cmH2O)"
      logic: OR
      expressions:
        - "items['pao2fio2ratio'] >= 150"
        - "(items[220277] >= 90) AND (items['fio2_bg'] <= 40) AND (items['peep_vent'] <= 5)"

    ph_ok:
      title: "pH criterion met"
      description: "Arterial pH > 7.25"
      expression: "items['ph_bg'] > 7.25"

    hemoglobin_ok:
      title: "Hemoglobin criterion met"
      description: "Hemoglobin >= 7 g/dL"
      expression: "items['hemoglobin_bg'] >= 7.0"

    temperature_ok:
      title: "Temperature criterion met"
      description: "Core temperature <= 38 degrees C"
      expression: "items[223762] <= 38.0"

    vasopressor_ok:
      title: "Vasopressor criterion met"
      description: >
        Norepinephrine-equivalent <= 0.1 mcg/kg/min (hemodynamically stable).
        Source: mimiciv_derived.norepinephrine_equivalent_dose
      expression: "items['norepinephrine_equiv'] <= 0.1"

    mental_status_ok:
      title: "Mental status criterion met"
      description: >
        Patient is awake and easily arousable.
        Satisfied if CAM-ICU RASS LOC (228302) = 'Yes' 
        OR Riker-SAS (223753) is in {3, 4} (Sedated/Calm).
      logic: OR
      expressions:
        - "items[228302] == 'Yes'"
        - "items[223753] in [3, 4]"
    
    inspiratory_effort_ok:
      title: "Inspiratory effort criterion met"
      description: >
        Tidal Volume (spontaneous) (itemid 224686) > 0 mL -- patient is
        initiating at least some spontaneous inspiratory effort.
        Proxy for Table 2 criterion 5: "initiate inspiratory effort".
      expression: "items[224686] > 0"
  # ── Constraints ───────────────────────────────────────────────────────────

  constraints:

    # ── Control-Flow ──────────────────────────────────────────────────────────

    - id: RC-CF-01
      label: "Invasive ventilation must precede SBT start"
      template: PRECEDENCE
      activation: SBTStarted
      target: InvasiveVentilationStarted
      rationale: >
        An SBT can only be initiated on a patient who is currently on invasive
        mechanical ventilation. Enforces that InvasiveVentilationStarted
        has occurred without an intervening end event.

    # ── Data-Perspective (MP-Declare activation conditions on SBTStarted) ─────

    - id: RC-DP-01
      label: "Oxygenation criterion must be met at SBT start"
      template: MP_EXISTENCE
      activation: SBTStarted
      activation_condition: "NOT oxygenation_ok"
      observation_window_hours: 24
      semantics: ACTIVATION_VIOLATION
      rationale: >
        PaO2/FiO2 >= 150 OR SpO2 >= 90% on FiO2 <= 40% and PEEP <= 5 cmH2O
        must be satisfied within 24 h before SBT initiation.

    - id: RC-DP-02
      label: "pH criterion must be met at SBT start"
      template: MP_EXISTENCE
      activation: SBTStarted
      activation_condition: "NOT ph_ok"
      observation_window_hours: 24
      semantics: ACTIVATION_VIOLATION
      rationale: "Arterial pH must exceed 7.25 at SBT initiation."

    - id: RC-DP-03
      label: "Hemoglobin criterion must be met at SBT start"
      template: MP_EXISTENCE
      activation: SBTStarted
      activation_condition: "NOT hemoglobin_ok"
      observation_window_hours: 24
      semantics: ACTIVATION_VIOLATION
      rationale: "Hemoglobin must be >= 7 g/dL at SBT initiation."

    - id: RC-DP-04
      label: "Temperature criterion must be met at SBT start"
      template: MP_EXISTENCE
      activation: SBTStarted
      activation_condition: "NOT temperature_ok"
      observation_window_hours: 24
      semantics: ACTIVATION_VIOLATION
      rationale: "Core temperature must not exceed 38 degrees C at SBT initiation."

    - id: RC-DP-05
      label: "Vasopressor criterion must be met at SBT start"
      template: MP_EXISTENCE
      activation: SBTStarted
      activation_condition: "NOT vasopressor_ok"
      observation_window_hours: 24
      semantics: ACTIVATION_VIOLATION
      rationale: >
        Patient must be hemodynamically stable (NE-equivalent <= 0.1 mcg/kg/min)
        at SBT initiation.

    - id: RC-DP-06
      label: "Mental status criterion must be met at SBT start"
      template: MP_EXISTENCE
      activation: SBTStarted
      activation_condition: "NOT mental_status_ok"
      observation_window_hours: 24
      semantics: ACTIVATION_VIOLATION
      rationale: >
        Patient must be awake and easily arousable (RASS LOC 'Yes' OR SAS 3-4) 
        within 24 h of SBT start.

    - id: RC-DP-07
      label: "Inspiratory effort criterion must be met at SBT start"
      template: MP_EXISTENCE
      activation: SBTStarted
      activation_condition: "NOT inspiratory_effort_ok"
      observation_window_hours: 24
      semantics: ACTIVATION_VIOLATION


 