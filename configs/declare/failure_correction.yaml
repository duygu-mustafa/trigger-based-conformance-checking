version: 1

model:
  name: failure_interventions
  description: >
    Post-SBT-failure intervention constraints derived from Akella et al. (2022),
    Table 1. Each constraint activates on SBTFailed and checks whether a specific
    diagnostic or stabilising intervention was recorded within a defined time window.
    No cause classification is performed: rules fire after every SBT failure and
    individual weights reflect how universally each intervention is expected.

    All templates conform to Burattin et al. (2016) Table 2 MP-Declare semantics.
    The custom `semantics` field has been removed; violation attribution is
    determined by the template algorithm:
      - response: SBTFailed activation instance moves to violations at closing()
        when no target event satisfying ϕ_c and ϕ_τ is found within the window.
      - precedence: target activation instance moves to violations when no prior
        occurrence of the activation satisfying ϕ_c is found.

    SBTFailed is defined as:
      - SBTCompleted with value = "Failure" (derived from weaning state transitions)

    Activity definitions:
      SBTFailed                    -- derived from above
      Bronchodilator_Admin         -- inputevents itemid 224170
      Diuretic_Admin               -- inputevents itemids [221794, 229639]
      AfterloadReduction_Admin     -- inputevents itemids [222056, 222051, 225974, 221429]
      ElectrolyteBG_Test           -- labevents itemids [50971, 50960, 50970, 50882, 50818, 50820]
      ElectrolyteCorrection_Admin  -- inputevents itemids [222011, 227536, 222151, 220995, 227523]
      HormonalLab_Test             -- labevents itemids [227463, 50993, 50995]
      HormonalReplacement_Admin    -- prescriptions drugnames
                                      ["HYDROCORTISONE", "METHYLPREDNISOLONE",
                                       "DEXAMETHASONE", "LEVOTHYROXINE SODIUM"]

# ── Constraints ────────────────────────────────────────────────────────────
# All response constraints follow Burattin et al. Table 2:
# MFOTL: G(∀x.((SBTFailed ∧ ϕ_a(x)) → F_[0, max_gap)(Target ∧ ∃y.ϕ_c(x,y))))
# ϕ_a is unconstrained (every SBTFailed fires the constraint).
# ϕ_c is unconstrained (any occurrence of the target activity satisfies).
# ϕ_τ = [0, max_gap_hours) expressed via time_condition.

constraints:

  # ── Stabilising: Airway ───────────────────────────────────────────────────

  - id: INT-TR-01
    label: "Bronchodilator present in post-failure intervention window"
    template: RESPONSE
    activation: SBTFailed
    outcome_scope: next_episode  # inter-episode rule: outcome = next episode sbt_outcome
    target: Bronchodilator_Admin
    context_window_post_hours: 24
    # source: icu.inputevents, itemid 224170
    time_condition:
      max_hours: 24
    rationale: >
      Inhaled bronchodilators are a first-line stabilising intervention
      for airway resistance as a cause of weaning failure (Akella et al.,
      2022, Table 1). Absence within 24 h of a failed SBT indicates the
      airway resistance pathway was not addressed before the next attempt.

  # ── Stabilising: Compliance / Fluid ──────────────────────────────────────

  - id: INT-TR-02
    label: "Diuretic present in post-failure intervention window"
    template: RESPONSE
    activation: SBTFailed
    outcome_scope: next_episode  # inter-episode rule: outcome = next episode sbt_outcome
    target: Diuretic_Admin
    context_window_post_hours: 24
    # source: icu.inputevents
    # itemids: [221794 (Furosemide), 229639 (Bumetanide)]
    time_condition:
      max_hours: 24
    rationale: >
      Diuretics reduce pulmonary and chest-wall oedema, improving static
      compliance and reducing respiratory workload before the next SBT
      (Akella et al., 2022, Table 1). Absence within 24 h suggests fluid
      overload was not actively managed following failure.

  # ── Stabilising: Cardiac ──────────────────────────────────────────────────

  - id: INT-TR-03
    label: "Afterload reduction present in post-failure intervention window"
    template: RESPONSE
    activation: SBTFailed
    outcome_scope: next_episode  # inter-episode rule: outcome = next episode sbt_outcome
    target: AfterloadReduction_Admin
    context_window_post_hours: 24
    # source: icu.inputevents
    # itemids: [222056 (Nitroglycerin), 222051 (Nitroprusside),
    #           225974 (Metoprolol),    221429 (Esmolol)]
    time_condition:
      max_hours: 24
    rationale: >
      Afterload reduction agents address weaning-induced cardiac dysfunction
      by reducing LV preload and afterload (Akella et al., 2022, Table 1).
      Absence within 24 h of a failed SBT suggests the cardiovascular
      pathway was not treated.

  # ── Diagnostic: Electrolytes & Blood Gas ─────────────────────────────────

  - id: INT-DX-04
    label: "Electrolyte and blood gas labs drawn after SBT failure"
    template: RESPONSE
    activation: SBTFailed
    outcome_scope: next_episode  # inter-episode rule: outcome = next episode sbt_outcome
    target: ElectrolyteBG_Test
    context_window_post_hours: 6
    # source: hosp.labevents
    # itemids: [50971 (K), 50960 (Mg), 50970 (Phos),
    #           50882 (HCO3), 50818 (pCO2), 50820 (pH)]
    time_condition:
      max_hours: 6
    rationale: >
      Electrolyte derangements (low K, Mg, Phos) and blood gas abnormalities
      (acidosis, hypercapnia) are common reversible causes of SBT failure
      (Akella et al., 2022, Table 1). A basic metabolic panel and ABG should
      be drawn within 6 h of any failed SBT. The 6 h window reflects that
      this is a routine, near-immediate workup rather than a specialist order.

  # ── Stabilising: Electrolyte Correction ──────────────────────────────────

  - id: INT-TR-04
    label: "Electrolyte replacement present in post-failure intervention window"
    template: RESPONSE
    activation: SBTFailed
    outcome_scope: next_episode  # inter-episode rule: outcome = next episode sbt_outcome
    target: ElectrolyteCorrection_Admin
    context_window_post_hours: 24
    # source: icu.inputevents
    # itemids: [222011, 227536 (KCl), 222151 (K-Phos/Na-Phos),
    #           220995, 227523 (MgSO4)]
    time_condition:
      max_hours: 24
    rationale: >
      Electrolyte replacement corrects muscle weakness caused by low K, Mg,
      or Phos before the next SBT attempt (Akella et al., 2022, Table 1).
      Absence within 24 h indicates the metabolic pathway was not addressed
      after failure.

  # ── Diagnostic: Cortisol / Thyroid ───────────────────────────────────────

  - id: INT-DX-05
    label: "Cortisol and thyroid function labs drawn after SBT failure"
    template: RESPONSE
    activation: SBTFailed
    outcome_scope: next_episode  # inter-episode rule: outcome = next episode sbt_outcome
    target: HormonalLab_Test
    context_window_post_hours: 24
    # source: hosp.labevents
    # itemids: [227463 (Cortisol), 50993 (TSH), 50995 (Free T4)]
    time_condition:
      max_hours: 24
    rationale: >
      Adrenal insufficiency and hypothyroidism are reversible endocrine
      causes of weaning failure (Akella et al., 2022, Table 1). Cortisol
      and thyroid function tests should be drawn within 24 h of a failed
      SBT. Low expected compliance reflected in weights (selective, not
      routine, tests).

  # ── Stabilising: Hormonal Replacement ────────────────────────────────────

  - id: INT-TR-05
    label: "Hormonal replacement present in post-failure intervention window"
    template: RESPONSE
    activation: SBTFailed
    outcome_scope: next_episode  # inter-episode rule: outcome = next episode sbt_outcome
    target: HormonalReplacement_Admin
    context_window_post_hours: 48
    # source: hosp.prescriptions
    # drugnames (adrenal): ["HYDROCORTISONE", "METHYLPREDNISOLONE", "DEXAMETHASONE"]
    # drugnames (thyroid): ["LEVOTHYROXINE SODIUM"]
    time_condition:
      max_hours: 48
    rationale: >
      Stress-dose corticosteroids and thyroid hormone replacement address
      confirmed endocrine dysfunction contributing to weaning failure
      (Akella et al., 2022, Table 1). The 48 h window reflects the slower
      prescribing decision for thyroid replacement. Marked as a soft rule
      in weights due to known gaps in corticosteroid charting in MIMIC-IV.

  # ── Composite safety net ─────────────────────────────────────────────────

  - id: INT-COMPOSITE-01
    label: "At least one failure intervention must occur after SBT failure"
    template: RESPONSE
    activation: SBTFailed
    outcome_scope: next_episode  # inter-episode rule: outcome = next episode sbt_outcome
    target: AnyFailureIntervention
    context_window_post_hours: 24
    # AnyFailureIntervention is a derived activity resolved in preprocessing:
    # exists(inputevents,  itemid IN [224170, 221794, 229639,
    #                                 222056, 222051, 225974, 221429,
    #                                 222011, 227536, 222151, 220995, 227523])
    # OR exists(labevents, itemid IN [50971, 50960, 50970, 50882, 50818, 50820,
    #                                 227463, 50993, 50995])
    # OR exists(prescriptions, drugname IN ['HYDROCORTISONE', 'METHYLPREDNISOLONE',
    #                                        'DEXAMETHASONE', 'LEVOTHYROXINE SODIUM'])
    # preprocessing_required: true
    time_condition:
      max_hours: 24
    rationale: >
      Safety net rule ensuring at least one intervention from any failure
      pathway is documented within 24 h of a failed SBT.

  # ── Sequencing (precedence) ───────────────────────────────────────────────
  # Template: precedence (Burattin et al. Table 2)
  # MFOTL: G(∀x.((B ∧ ϕ_a(x)) → O_I(A ∧ ∃y.ϕ_c(x,y))))
  # B (activation) = the treatment event — whose occurrence fires the check.
  # A (target)     = the diagnostic event — must have occurred before B.
  # Violation: treatment activation instance moves to violations when no
  # prior diagnostic event is found in the trace history.

  - id: INT-SEQ-01
    label: "Electrolyte correction must be preceded by electrolyte or blood gas testing"
    template: PRECEDENCE
    activation: ElectrolyteCorrection_Admin   # B — fires the backward check
    target: ElectrolyteBG_Test                # A — must have occurred before B
    rationale: >
      Post-SBT failure electrolyte replacement should be informed by recent
      laboratory assessment of electrolytes or blood gases in the same stay,
      rather than occurring without prior testing (Akella et al., 2022, Table 1).

  - id: INT-SEQ-02
    label: "Hormonal replacement must be preceded by hormonal diagnostic testing"
    template: PRECEDENCE
    activation: HormonalReplacement_Admin     # B — fires the backward check
    target: HormonalLab_Test                  # A — must have occurred before B
    rationale: >
      Endocrine replacement after SBT failure should follow diagnostic
      evaluation for adrenal or thyroid dysfunction (Akella et al., 2022,
      Table 1).