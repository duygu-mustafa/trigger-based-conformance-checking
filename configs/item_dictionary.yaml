version: 1

# Items are split by source table in MIMIC-IV.
# chartevents items use itemid; procedureevents use itemid from d_items.

sources:

  chartevents:

    # ── Oxygenation ──────────────────────────────────────────────────────
    220224: PaO2                        # Arterial O2 pressure (mmHg)
    223835: FiO2                        # Inspired O2 Fraction (0-1 scale)
    220277: SpO2                        # O2 saturation pulseoxymetry (%)
    220339: PEEP                        # PEEP set (cmH2O)

    # ── Derived / Virtual IDs ────────────────────────────────────────────
    norepinephrine_equiv: Norepinephrine-equivalent dose (mcg/kg/min)
    pao2fio2ratio: PaO2/FiO2 Ratio (mimiciv_derived.bg)
    fio2_bg: FiO2 (COALESCE bg.fio2, bg.fio2_chartevents)
    peep_vent: PEEP (ventilator_setting.peep)
    ph_bg: pH (bg.ph)
    hemoglobin_bg: Hemoglobin (bg.hemoglobin)
    sbt_status: Spontaneous Breathing Trial Status Signal
    sbt_outcome: Spontaneous Breathing Trial Final Outcome
    derived_invasive_ventilation_start: Invasive Ventilation Start (Derived)
    223830: pH_arterial                 # PH Arterial
    220228: hemoglobin                  # Hemoglobin (g/dL)

    # ── Vital Signs ──────────────────────────────────────────────────────
    223762: temperature_c               # Temperature Celsius (°C)
    220045: heart_rate                  # Heart Rate (bpm)
    220179: sbp                         # Systolic Blood Pressure (mmHg)
    220181: map                         # Mean Arterial Pressure (mmHg)
    220210: respiratory_rate            # Respiratory Rate (insp/min)

    # ── Neurological / Sedation ──────────────────────────────────────────
    228302: rass_loc                    # CAM-ICU RASS LOC (Pain/Sedation) - Text
    223753: sas                         # Riker-SAS Scale (Pain/Sedation) - Text

    # ── Vasopressors ─────────────────────────────────────────────────────
    221906: norepinephrine              # Norepinephrine dose (mcg/kg/min)
    norepinephrine_equiv: norepinephrine_equiv # Norepinephrine-equivalent dose (mcg/kg/min)

    # ── Respiratory Effort ───────────────────────────────────────────────
    229322: breathing_pattern_effort    # Breathing pattern/effort - Text (ordinal 0-3)
    223990: respiratory_effort          # Respiratory Effort - Text (ordinal 0-3)

    # ── Ventilation Parameters ───────────────────────────────────────────
    224685: tidal_volume_observed       # Tidal Volume observed (mL)
    224684: tidal_volume_set            # Tidal Volume set (mL)
    224686: tidal_volume_spontaneous    # Tidal Volume spontaneous (mL) -- proxy for inspiratory effort initiation
    224695: peak_insp_pressure          # Peak Inspiratory Pressure (cmH2O)
    224696: plateau_pressure            # Plateau Pressure (cmH2O)
    224697: mean_airway_pressure        # Mean Airway Pressure (cmH2O)

    # ── Musculoskeletal / NMJ ────────────────────────────────────────────
    224419: nif                         # Negative Inspiratory Force (cmH2O)
    228409: mrc_scale_1                 # MRC Scale limb strength components
    228410: mrc_scale_2
    228411: mrc_scale_3
    228412: mrc_scale_4

    # ── Cuff Leak Test ───────────────────────────────────────────────────
    224417: cuff_pressure               # Cuff Pressure (cmH2O)
    224418: cuff_volume                 # Cuff Volume (mL)

    # ── Endocrine / Metabolic ────────────────────────────────────────────
    50993:  tsh                         # Thyroid Stimulating Hormone (mIU/L)
    50995:  t4_free                     # Thyroxine T4 Free (ng/dL)
    227463: cortisol                    # Cortisol (mcg/dL)

    226814: known_difficult_intubation  # Known difficult intubation - Text (Yes/No)

  inputevents:

    # ── Post-Failure Stabilising Medications ─────────────────────────────
    224170: bronchodilator_admin         # MDI #1 Drug (inhaled bronchodilator)
    221794: furosemide_admin             # Furosemide
    229639: bumetanide_admin             # Bumetanide
    222056: nitroglycerin_admin          # Nitroglycerin
    222051: nitroprusside_admin          # Nitroprusside
    225974: metoprolol_admin             # Metoprolol
    221429: esmolol_admin                # Esmolol

    # ── Electrolyte Replacement ──────────────────────────────────────────
    222011: potassium_chloride_admin     # Potassium chloride replacement
    227536: potassium_chloride_alt_admin # Potassium chloride replacement (alt item)
    222151: potassium_phosphate_admin    # Potassium/Sodium phosphate replacement
    220995: magnesium_sulfate_admin      # Magnesium sulfate replacement
    227523: magnesium_sulfate_alt_admin  # Magnesium sulfate replacement (alt item)

  labevents:

    # ── Electrolyte and Blood Gas Follow-Up ──────────────────────────────
    50971: potassium_lab                 # Potassium
    50960: magnesium_lab                 # Magnesium
    50970: phosphate_lab                 # Phosphate
    50882: bicarbonate_lab               # Bicarbonate
    50818: pco2_lab                      # pCO2
    50820: ph_lab                        # pH

    # ── Endocrine Follow-Up ──────────────────────────────────────────────
    227463: cortisol_lab                 # Cortisol
    50993: tsh_lab                       # Thyroid Stimulating Hormone
    50995: t4_free_lab                   # Free T4

  prescriptions:

    # ── Hormonal Replacement (drugname-level) ────────────────────────────
    HYDROCORTISONE: hydrocortisone_admin
    METHYLPREDNISOLONE: methylprednisolone_admin
    DEXAMETHASONE: dexamethasone_admin
    LEVOTHYROXINE SODIUM: levothyroxine_admin

  procedureevents:

    # ── Ventilation Onset / Duration ─────────────────────────────────────
    224385: intubation
      # starttime = intubation timestamp
      # endtime   = extubation timestamp
      # category  = 1-Intubation/Extubation