version: 1

mappings:

  InvasiveVentilationStarted:
    source: ventilator_derived
    itemid: derived_invasive_ventilation_start
    timestamp_field: event_time
    description: "Invasive ventilation trigger event derived from ventilator settings."
 
  InvasiveVentilationEnded:
    source: ventilator_derived
    itemid: derived_invasive_ventilation_end
    timestamp_field: event_time
    description: "Invasive ventilation end event derived from ventilator settings."

  # ── SBT Execution Activities (derived from weaning logic) ────────────────

  SBTStarted:
    source: sbt_derived
    itemid: sbt_status
    conditions:
      value_equals: "Started"
    description: "SBT start event, derived from weaning state transitions."

  # ── Derived / Synthetic Activities ───────────────────────────────────────

  SBTFailed:
    derived: true
    logic: >
      Fired when InvasiveVentilationStarted occurs within 48h after SBTStarted
      (window bounded by next SBTStarted if present). Timestamp = re-vent time.

  SBTSucceeded:
    derived: true
    logic: >
      Fired when no InvasiveVentilationStarted occurs within 48h after SBTStarted.
      Timestamp = min(start + 48h, stay_end).
  
  # ── Post-SBT-Failure Intervention Activities ──────────────────────────────
  # Real mapped activities backing INT-* rules and AnyFailureIntervention below.

  Bronchodilator_Admin:
    source: chartevents
    itemid: 224170                                   # Albuterol / ipratropium MDI (charted, not inputevents)

  Diuretic_Admin:
    source: inputevents
    itemids: [221794, 229639]                        # Furosemide, Bumetanide

  AfterloadReduction_Admin:
    source: inputevents
    itemids: [222056, 222051, 225974, 221429]        # Nitroglycerin, Nitroprusside,
                                                     # Metoprolol, Esmolol

  ElectrolyteCorrection_Admin:
    source: inputevents
    itemids: [222011, 227536, 222151, 220995, 227523]
                                                     # KCl (x2), K-Phos/Na-Phos, MgSO4 (x2)

  ElectrolyteBG_Test:
    source: labevents
    itemids: [50971, 50960, 50970, 50882, 50818, 50820]
                                                     # K, Mg, Phos, HCO3, pCO2, pH

  HormonalLab_Test:
    source: labevents
    itemids:
      - itemid: 227463                               # Cortisol (charted, not labevents)
        source: chartevents
      - 50993                                        # TSH
      - 50995                                        # Free T4

  HormonalReplacement_Admin:
    source: prescriptions
    itemids: ["HYDROCORTISONE", "METHYLPREDNISOLONE", "DEXAMETHASONE", "LEVOTHYROXINE SODIUM"]

  AnyFailureIntervention:
    derived: true
    description: >
      Synthetic activity fired when at least one of the seven post-SBT-failure
      intervention activities above is recorded. Used as the target of
      INT-COMPOSITE-01 to enforce that at least one intervention pathway was
      addressed after a failed SBT. Resolved in
      activity_emitter._derive_activities by copying/renaming the source event;
      inherits its timestamp.

  # ── Discrete Clinical Action Activities ─────────────────────────────────
  # These represent deliberate one-off clinical decisions, not continuous monitoring.
  # Appropriate as Declare activities: the question is whether/when the action was taken.

  NIF_Measured:
    source: chartevents
    itemid: 224419
    description: "Negative Inspiratory Force measured (cmH2O) — respiratory muscle strength assessment."

  CuffLeakTest_Performed:
    source: chartevents
    itemids: [224417, 224418]
    description: "Cuff leak test performed via cuff pressure (224417) or cuff volume (224418) measurement."

  ABG_Taken:
    source: labevents
    itemids: [50820, 50818]
    description: "Arterial blood gas drawn; captures pH (50820) and pCO2 (50818) lab results."

  ElectrolytesLab_Drawn:
    source: labevents
    itemids: [50971, 50960, 50970]
    description: "Electrolyte panel drawn; captures potassium (50971), magnesium (50960), and phosphate (50970)."

  # ── Readiness Criterion Satisfaction Activities ───────────────────────────
  # Derived in activity_emitter._derive_activities. Each fires only when the
  # corresponding SBT readiness criterion IS satisfied, enabling PRECEDENCE
  # constraints to enforce "SBTStarted must be preceded by [X] within 24h."

  OxygenationMeasured:
    derived: true
    description: >
      Fires unconditionally for every PaO2/FiO2 (itemid pao2fio2ratio) or SpO2
      (itemid 220277) measurement. Threshold (>=150, or >=90% with FiO2 <= 40%
      and PEEP <= 5 cmH2O) is enforced solely by the checker's oxygenation_ok
      correlation_condition, not at emission time.

  pHMeasured:
    derived: true
    description: >
      Fires for every arterial pH measurement (itemid ph_bg). Threshold (> 7.25)
      is enforced via correlation_condition on the PRECEDENCE rule (RC-DP-02),
      which evaluates only the most recent preceding event (target_selection: last).

  HemoglobinMeasured:
    derived: true
    description: >
      Fires for every hemoglobin measurement (itemid hemoglobin_bg). Threshold
      (>= 7.0 g/dL) is enforced via correlation_condition on the PRECEDENCE rule
      (RC-DP-03), evaluated on the most recent preceding event (target_selection: last).

  TemperatureMeasured:
    derived: true
    description: >
      Fires for every core temperature measurement (itemid 223762). Threshold
      (<= 38.0 °C) is enforced via correlation_condition on the PRECEDENCE rule
      (RC-DP-04), evaluated on the most recent preceding event (target_selection: last).

  VasopressorMeasured:
    derived: true
    description: >
      Fires for every norepinephrine-equivalent measurement (itemid norepinephrine_equiv).
      Threshold (<= 0.1 mcg/kg/min) is enforced via correlation_condition on the
      PRECEDENCE rule (RC-DP-05), evaluated on the most recent preceding event
      (target_selection: last).

  MentalStatusMeasured:
    derived: true
    description: >
      Fires for every RASS LOC measurement (itemid 228302) and every SAS
      measurement (itemid 223753, the far more common fallback instrument
      in this cohort). Threshold (RASS = 'No', or SAS in [3, 4]) is enforced
      via correlation_condition on the PRECEDENCE rule (RC-DP-06), evaluated
      on the most recent preceding event (target_selection: last).

  InspiratoryEffortMeasured:
    derived: true
    description: >
      Fires for every spontaneous tidal volume measurement (itemid 224686). Threshold
      (> 0 mL) is enforced via correlation_condition on the PRECEDENCE rule (RC-DP-07),
      evaluated on the most recent preceding event (target_selection: last).
